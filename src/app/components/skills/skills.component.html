<section class="skills-section page-content" id="skills">
  <div class="skills-header-block">
    <h2 class="section-title">
      {{ isSdeMode() ? 'Tech Stack & Engineering Skills' : 'Cybersecurity Competencies' }}
    </h2>
    <p class="section-subtitle">
      {{ isSdeMode() 
          ? '' 
          : 'Offensive security, penetration testing, malware triage, network defense, and vulnerability auditing expertise.' 
      }}
    </p>
  </div>

  <!-- Skill Categories (No cross-mixing between SDE and Cyber) -->
  <div class="tab-content active">
    <div class="skill-category" *ngFor="let category of activeCategories">
      <h3 class="category-title">
        <i [class]="category.icon"></i> {{ category.title }}
      </h3>
      <div class="skills-container">
        <div
          #skillBadge
          class="skill-badge"
          [class.soft-skill]="skill.isSoft"
          [class.cyber]="skill.isCyber"
          *ngFor="let skill of category.skills">
          <i [class]="skill.icon"></i>
          <span>{{ skill.name }}</span>
          <div class="skill-progress" *ngIf="skill.level">
            <div
              class="progress-bar"
              [class.cyber-bar]="skill.isCyber"
              [style.width.%]="skill.level">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
