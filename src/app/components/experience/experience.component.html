<div class="page-content experience-page">
  <div class="container">
    <h1 class="section-title">
      {{ isSdeMode ? '💼 Software Engineering Experience' : '🛡️ Cybersecurity Experience & Internships' }}
    </h1>

    <div class="timeline">
      <div class="timeline-item" *ngFor="let exp of experiences">
        <div class="timeline-dot"></div>
        <div class="timeline-content card-glow">
          <div class="exp-header">
            <h2>{{ exp.role }}</h2>
            <span class="company">&#64; {{ exp.company }}</span>
          </div>
          <span class="duration"><i class="far fa-calendar-alt"></i> {{ exp.duration }}</span>
          <p class="details">{{ exp.details }}</p>
          <div class="skills-tags" *ngIf="exp.skills" style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;">
            <span *ngFor="let skill of exp.skills" style="background: rgba(0, 255, 65, 0.1); border: 1px solid rgba(0, 255, 65, 0.2); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">
              {{ skill }}
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
