<div class="dock-wrapper">
  <div class="dock-container">
    <!-- Home -->
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="dock-item">
      <div class="dock-icon-bg">
        <div class="dock-icon"><i class="fas fa-home"></i></div>
      </div>
      <span class="dock-label">Home</span>
    </a>

    <!-- About -->
    <a routerLink="/about" routerLinkActive="active" class="dock-item">
      <div class="dock-icon-bg">
        <div class="dock-icon"><i class="fas fa-user-astronaut"></i></div>
      </div>
      <span class="dock-label">About</span>
    </a>

    <!-- Experience -->
    <a routerLink="/experience" routerLinkActive="active" class="dock-item">
      <div class="dock-icon-bg">
        <div class="dock-icon"><i class="fas fa-briefcase"></i></div>
      </div>
      <span class="dock-label">Experience</span>
    </a>
  </div>
</div>
