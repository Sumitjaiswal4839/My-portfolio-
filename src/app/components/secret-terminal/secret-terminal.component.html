<!-- Secret Terminal Overlay - Triggered by pressing backtick (`) 3 times -->
<div class="terminal-overlay" *ngIf="isOpen" (click)="closeTerminal()">
  <div class="terminal-window" (click)="$event.stopPropagation()">

    <!-- Title Bar -->
    <div class="terminal-titlebar">
      <div class="titlebar-dots">
        <span class="dot dot-red" (click)="closeTerminal()"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <span class="titlebar-title">portfolio-admin — terminal</span>
      <div class="titlebar-right">
        <span class="auth-badge" [class.authenticated]="isAuthenticated">
          {{ isAuthenticated ? '● root' : '○ guest' }}
        </span>
      </div>
    </div>

    <!-- Terminal Body -->
    <div class="terminal-body">
      <div class="terminal-lines">
        <div
          *ngFor="let line of lines"
          class="terminal-line"
          [ngClass]="'line-' + line.type">
          {{ line.text }}
        </div>
      </div>

      <!-- Input Row -->
      <div class="terminal-input-row">
        <span class="prompt">{{ isAuthenticated ? 'root@portfolio:~#' : 'guest@portfolio:~$' }}</span>
        <input
          #terminalInput
          class="terminal-input"
          [(ngModel)]="inputValue"
          (keydown.enter)="onEnter()"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder=""
        />
      </div>
    </div>

  </div>
</div>
