<div class="page-content certifications-page">
  <div class="container">
    <div class="header">
      <h1 class="section-title">Certifications</h1>
      <button *adminOnly (click)="toggleAddForm()" class="btn btn-primary add-btn">
        <i class="fas" [class.fa-plus]="!showAddForm" [class.fa-times]="showAddForm"></i>
        {{ showAddForm ? 'Cancel' : 'Add Certification' }}
      </button>
    </div>

    <!-- Add Form -->
    <div class="add-form-container" *ngIf="showAddForm">
      <div class="card form-card">
        <h3>{{ isEditing ? 'Edit Certification' : 'New Certification' }}</h3>
        <div class="form-group">
          <label>Title</label>
          <input type="text" [(ngModel)]="newCert.title" placeholder="e.g., CompTIA Security+">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea [(ngModel)]="newCert.description" placeholder="A brief description..."></textarea>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" [(ngModel)]="newCert.date">
        </div>
        <div class="form-group">
          <label>Upload (PDF, JPEG, PNG, HIEC)</label>
          <input type="file" (change)='onFileSelected($event)' accept="application/pdf,image/*">
        </div>

        <!-- Preview -->
        <div class="preview-area" *ngIf="newCert.fileUrl">
          <p>Preview:</p>
          <div class="preview-box">
            <iframe *ngIf="newCert.fileType === 'pdf'" [src]="newCert.fileUrl | safeUrl" class="pdf-preview"></iframe>
            <img *ngIf="newCert.fileType === 'image'" [src]="newCert.fileUrl" class="img-preview">
          </div>
        </div>

        <button (click)="saveCertification()" class="btn btn-primary submit-btn" [disabled]="!newCert.title || !newCert.fileUrl">
          {{ isEditing ? 'Update Certification' : 'Save Certification' }}
        </button>
      </div>
    </div>

    <!-- Grid -->
    <div class="certs-grid">
      <div class="cert-card" *ngFor="let cert of certifications$ | async">
        <div class="cert-preview" (click)="viewFile(cert)">
          <i *ngIf="cert.fileType === 'pdf'" class="fas fa-file-pdf"></i>
          <img *ngIf="cert.fileType === 'image'" [src]="cert.fileUrl" alt="Certificate for {{ cert.title }}">
          <div class="overlay"><i class="fas fa-eye"></i> View</div>
        </div>
        <div class="cert-info">
          <h3>{{ cert.title }}</h3>
          <p>{{ cert.description }}</p>
          <span class="date">{{ cert.date | date }}</span>
        </div>
        <div class="cert-actions" *adminOnly>
          <button (click)="editCertification(cert)" class="edit-btn" title="Edit">
            <i class="fas fa-edit"></i>
          </button>
          <button (click)="deleteCertification(cert.id)" class="delete-btn" title="Delete">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
