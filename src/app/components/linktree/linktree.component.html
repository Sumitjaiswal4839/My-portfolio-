<div class="linktree-container">
  <div class="linktree-card">
    <div class="profile-section">
      <div class="profile-pic" style="overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width: 80%; height: 80%; filter: drop-shadow(0 0 8px #00ff41);">
          <defs>
            <linearGradient id="neonGlowLink" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00ff41" />
              <stop offset="100%" stop-color="#00d4ff" />
            </linearGradient>
            <filter id="neonBlur" x="-40%" y="-40%" width="180%" height="180%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
              <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
              <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Outer Rings -->
          <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(0, 255, 65, 0.5)" stroke-width="2" stroke-dasharray="10 5">
            <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
          </circle>
          <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(0, 212, 255, 0.6)" stroke-width="3" stroke-dasharray="40 20">
            <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite" />
          </circle>

          <!-- ── PURE CLASSIC HACKER ICON ── -->
          <g filter="url(#neonBlur)" transform="matrix(0.24, 0, 0, 0.24, 46, 32)">
            <path d="M224 16c-6.7 0-10.8-2.8-15.5-6.1C201.9 5.4 194 0 176 0c-30.5 0-52 43.7-66 89.4C62.7 98.1 32 112.2 32 128c0 14.3 25 27.1 64.6 35.9c-.4 4-.6 8-.6 12.1c0 17 3.3 33.2 9.3 48H45.4C38 224 32 230 32 237.4c0 1.7 .3 3.4 1 5l38.8 96.9C28.2 371.8 0 423.8 0 482.3C0 498.7 13.3 512 29.7 512H418.3c16.4 0 29.7-13.3 29.7-29.7c0-58.5-28.2-110.5-71.8-143L415 242.4c.6-1.6 1-3.3 1-5c0-7.4-6-13.4-13.4-13.4H342.7c6-14.8 9.3-31 9.3-48c0-4.1-.2-8.1-.6-12.1C391 155.1 416 142.3 416 128c0-15.8-30.7-29.9-78-38.6C324 43.7 302.5 0 272 0c-18 0-25.9 5.4-32.5 9.9c-4.8 3.3-8.8 6.1-15.5 6.1zm56 208H267.6c-16.5 0-31.1-10.6-36.3-26.2c-2.3-7-12.2-7-14.5 0c-5.2 15.6-19.9 26.2-36.3 26.2H168c-22.1 0-40-17.9-40-40V169.6c28.2 4.1 61 6.4 96 6.4s67.8-2.3 96-6.4V184c0 22.1-17.9 40-40 40zm-88 96l16 32L176 480 128 288l64 32zm128-32L272 480 240 352l16-32 64-32z" 
                  fill="#030f03" stroke="url(#neonGlowLink)" stroke-width="7"/>
            <circle cx="168" cy="180" r="15" fill="#00ff41">
              <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
            </circle>
            <circle cx="280" cy="180" r="15" fill="#00ff41">
              <animate attributeName="opacity" values="1;0.4;1" dur="2s" begin="0.2s" repeatCount="indefinite"/>
            </circle>
          </g>
        </svg>
      </div>
      <h1 class="profile-name">{{ name }}</h1>
      <p class="profile-title">{{ title }}</p>
    </div>

    <div class="links-section">
      <a *ngFor="let link of links" [href]="link.url" target="_blank" class="link-item"
        [style.--hover-color]="link.color">
        <div class="link-icon" [style.color]="link.color">
          <i [class]="link.icon"></i>
        </div>
        <span class="link-text">{{ link.name }}</span>
      </a>
    </div>

    <div class="footer-social">
      <p>Connect with me!</p>
    </div>
  </div>
</div>
